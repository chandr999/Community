<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insta Clone</title>
  <style>
    [hidden] { display: none !important; }
    body { margin: 0; background: #fafafa; font-family: system-ui, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #dbdbdb; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
    .logo { font-weight: 700; font-size: 20px; color: inherit; text-decoration: none; }
    #auth { display: flex; gap: 6px; align-items: center; font-size: 14px; }
    #auth input { padding: 5px; width: 100px; border: 1px solid #dbdbdb; border-radius: 4px; }
    button { padding: 5px 10px; border: 1px solid #dbdbdb; border-radius: 4px; background: #fff; cursor: pointer; }
    #msg { color: #c00; font-size: 12px; }
    .ulink { color: inherit; text-decoration: none; font-weight: 600; }
    .ulink:hover { text-decoration: underline; }
    #composer { max-width: 470px; margin: 20px auto 0; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 12px; }
    #composer:empty { display: none; }
    #composer input[type=text] { padding: 6px; border: 1px solid #dbdbdb; border-radius: 4px; }
    #tabs { max-width: 470px; margin: 16px auto 0; display: flex; gap: 8px; }
    #tabs:empty { display: none; }
    #tabs .tab.active { background: #262626; color: #fff; border-color: #262626; }
    #feed { max-width: 470px; margin: 20px auto; }
    .empty { color: #737373; text-align: center; padding: 24px 0; }
    .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; }
    .user { display: flex; align-items: center; gap: 10px; padding: 12px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #c7c7c7; flex: none; }
    .card img { width: 100%; display: block; }
    .actions { padding: 10px 12px 0; display: flex; align-items: center; gap: 8px; }
    .actions .like { background: none; border: none; font-size: 26px; padding: 0; cursor: pointer; }
    .hint { color: #c00; font-size: 12px; }
    .meta { padding: 4px 12px 8px; }
    .linkbtn { background: none; border: none; color: #737373; padding: 0 12px 12px; cursor: pointer; text-align: left; }
    .comments { padding: 0 12px 12px; font-size: 14px; }
    .comments .row { margin-bottom: 6px; word-wrap: break-word; }
    .comments .newcomment { display: flex; gap: 6px; margin-top: 8px; }
    .comments .newcomment input { flex: 1; padding: 6px; border: 1px solid #dbdbdb; border-radius: 4px; }
    #profileView { max-width: 600px; margin: 20px auto; padding: 0 12px; }
    #profileView .back { color: #737373; text-decoration: none; font-size: 14px; }
    #profileView .phead { display: flex; align-items: center; gap: 20px; margin: 16px 0; flex-wrap: wrap; }
    #profileView .pname { font-size: 22px; font-weight: 700; }
    #profileView .stats { display: flex; gap: 20px; font-size: 14px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #eee; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#/">InstaClone</a>
    <div id="auth"></div>
  </header>

  <div id="homeView">
    <div id="composer"></div>
    <div id="tabs"></div>
    <div id="feed"></div>
  </div>
  <div id="profileView" hidden></div>

  <script>
    let loggedIn = false;
    let scope = 'all'; // 'all' or 'following'

    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    async function post(path, body) {
      return fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
    }

    function likesText(n) {
      return n + (n === 1 ? ' like' : ' likes');
    }

    function userLink(name) {
      const a = el('a', name, 'ulink');
      a.href = '#/u/' + encodeURIComponent(name);
      return a;
    }

    function commentRow(c) {
      const row = el('div', undefined, 'row');
      row.append(userLink(c.user), document.createTextNode(' ' + c.body));
      return row;
    }

    // ---------- routing ----------
    function route() {
      const h = location.hash;
      if (h.startsWith('#/u/')) {
        showProfile(decodeURIComponent(h.slice(4)));
      } else {
        showHome();
      }
    }

    function showHome() {
      document.getElementById('homeView').hidden = false;
      document.getElementById('profileView').hidden = true;
      renderTabs();
      loadFeed();
    }

    function renderTabs() {
      const box = document.getElementById('tabs');
      box.textContent = '';
      if (!loggedIn) { scope = 'all'; return; }
      [['all', 'Everyone'], ['following', 'Following']].forEach(([key, label]) => {
        const b = el('button', label, 'tab' + (scope === key ? ' active' : ''));
        b.onclick = () => { scope = key; renderTabs(); loadFeed(); };
        box.append(b);
      });
    }

    // ---------- profile page ----------
    async function showProfile(name) {
      document.getElementById('homeView').hidden = true;
      const view = document.getElementById('profileView');
      view.hidden = false;
      view.textContent = '';

      const back = el('a', '← Back to feed', 'back');
      back.href = '#/';
      view.append(back);

      const res = await fetch('/api/users/' + encodeURIComponent(name));
      if (!res.ok) { view.append(el('p', 'User not found', 'empty')); return; }
      const pr = await res.json();

      const head = el('div', undefined, 'phead');
      head.append(el('span', '@' + pr.username, 'pname'));

      if (pr.is_me) {
        head.append(el('span', "That's you", 'hint'));
      } else if (!loggedIn) {
        head.append(el('span', 'Log in to follow', 'hint'));
      } else {
        const fb = el('button', pr.followed_by_me ? 'Unfollow' : 'Follow');
        fb.onclick = async () => {
          const r = await fetch('/api/users/' + encodeURIComponent(pr.username) + '/follow', {
            method: pr.followed_by_me ? 'DELETE' : 'POST',
          });
          if (r.ok) showProfile(pr.username);
        };
        head.append(fb);
      }
      view.append(head);

      const stats = el('div', undefined, 'stats');
      stats.append(
        el('span', pr.post_count + (pr.post_count === 1 ? ' post' : ' posts')),
        el('span', pr.follower_count + (pr.follower_count === 1 ? ' follower' : ' followers')),
        el('span', pr.following_count + ' following'),
      );
      view.append(stats);

      if (pr.posts.length === 0) {
        view.append(el('p', 'No posts yet', 'empty'));
        return;
      }
      const grid = el('div', undefined, 'grid');
      pr.posts.forEach(g => {
        const img = el('img'); img.src = g.image_url; img.loading = 'lazy';
        grid.append(img);
      });
      view.append(grid);
    }

    // ---------- composer / auth ----------
    function renderComposer() {
      const box = document.getElementById('composer');
      box.textContent = '';
      if (!loggedIn) return;

      const file = el('input');
      file.type = 'file';
      file.accept = 'image/jpeg,image/png,image/webp,image/gif';
      const cap = el('input'); cap.type = 'text'; cap.placeholder = 'Caption';
      const msg = el('span'); msg.style.color = '#c00'; msg.style.fontSize = '12px';
      const btn = el('button', 'Post');

      btn.onclick = async () => {
        if (!file.files[0]) { msg.textContent = 'Choose a photo first'; return; }
        const fd = new FormData();
        fd.append('caption', cap.value);
        fd.append('image', file.files[0]);
        btn.disabled = true;
        msg.textContent = 'Uploading...';
        const r = await fetch('/api/posts', { method: 'POST', body: fd });
        btn.disabled = false;
        if (r.ok) { file.value = ''; cap.value = ''; msg.textContent = ''; loadFeed(); }
        else if (r.status === 413) msg.textContent = 'Photo too large (max 10 MB)';
        else if (r.status === 415) msg.textContent = 'Only JPEG, PNG, WebP or GIF photos';
        else if (r.status === 400) msg.textContent = 'Check the photo and keep the caption under 500 characters';
        else if (r.status === 401) msg.textContent = 'Please log in again';
        else msg.textContent = 'Something went wrong';
      };
      box.append(file, cap, btn, msg);
    }

    async function renderAuth() {
      const box = document.getElementById('auth');
      box.textContent = '';
      const res = await fetch('/api/me');
      loggedIn = res.ok;
      renderComposer();

      if (res.ok) {
        const me = await res.json();
        const out = el('button', 'Log out');
        out.onclick = async () => { await post('/api/logout'); renderAuth(); };
        const mine = userLink('@' + me.username);
        mine.href = '#/u/' + encodeURIComponent(me.username);
        box.append(mine, out);
      } else {
        const u = el('input'); u.placeholder = 'username';
        const p = el('input'); p.placeholder = 'password'; p.type = 'password';
        const msg = el('span'); msg.id = 'msg';
        const login = el('button', 'Log in');
        const signup = el('button', 'Sign up');

        async function submit(path) {
          const r = await post(path, { username: u.value, password: p.value });
          if (r.ok) return renderAuth();
          if (r.status === 401) msg.textContent = 'Wrong username or password';
          else if (r.status === 409) msg.textContent = 'Username already taken';
          else if (r.status === 400) msg.textContent = 'Username: 3-30 letters/numbers/_ , password: 8+ characters';
          else msg.textContent = 'Something went wrong';
        }
        login.onclick = () => submit('/api/login');
        signup.onclick = () => submit('/api/signup');
        box.append(u, p, login, signup, msg);
      }

      route(); // re-draw the current page so it matches who is logged in
    }

    // ---------- feed ----------
    async function loadFeed() {
      const url = scope === 'following' ? '/api/feed?scope=following' : '/api/feed';
      const posts = await (await fetch(url)).json();
      const feed = document.getElementById('feed');
      feed.textContent = '';

      if (posts.length === 0) {
        feed.append(el('p', scope === 'following'
          ? 'Nothing here yet. Click a username to visit a profile and follow them.'
          : 'No posts yet.', 'empty'));
        return;
      }

      posts.forEach(p => {
        const card = el('div', undefined, 'card');
        const user = el('div', undefined, 'user');
        user.append(el('div', undefined, 'avatar'), userLink(p.user));

        const img = el('img'); img.src = p.image_url;

        const actions = el('div', undefined, 'actions');
        const heart = el('button', undefined, 'like');
        const hint = el('span', undefined, 'hint');
        actions.append(heart, hint);

        const meta = el('div', undefined, 'meta');
        const count = el('b');
        meta.append(count, el('br'), userLink(p.user), document.createTextNode(' ' + p.caption));

        function paint() {
          heart.textContent = p.liked_by_me ? '♥' : '♡';
          heart.style.color = p.liked_by_me ? '#e0245e' : '';
          count.textContent = likesText(p.likes);
        }
        paint();

        heart.onclick = async () => {
          if (!loggedIn) { hint.textContent = 'Log in to like posts'; return; }
          hint.textContent = '';
          const r = await fetch('/api/posts/' + p.id + '/like', {
            method: p.liked_by_me ? 'DELETE' : 'POST',
          });
          if (r.ok) {
            p.likes += p.liked_by_me ? -1 : 1;
            p.liked_by_me = !p.liked_by_me;
            paint();
          } else if (r.status === 401) {
            hint.textContent = 'Please log in again';
          }
        };

        // ---- comments ----
        const cbtn = el('button', undefined, 'linkbtn');
        const cbox = el('div', undefined, 'comments');
        cbox.hidden = true;
        let loaded = false;

        function paintComments() {
          cbtn.textContent = p.comment_count === 0
            ? 'Add a comment'
            : 'View comments (' + p.comment_count + ')';
        }
        paintComments();

        cbtn.onclick = async () => {
          if (!cbox.hidden) { cbox.hidden = true; return; }
          cbox.hidden = false;
          if (loaded) return;
          loaded = true;

          const list = el('div');
          cbox.append(list);
          const res = await fetch('/api/posts/' + p.id + '/comments');
          if (res.ok) (await res.json()).forEach(c => list.append(commentRow(c)));

          if (!loggedIn) {
            cbox.append(el('span', 'Log in to comment', 'hint'));
            return;
          }
          const form = el('div', undefined, 'newcomment');
          const input = el('input'); input.type = 'text'; input.placeholder = 'Add a comment...';
          const send = el('button', 'Post');
          const err = el('span', undefined, 'hint');
          send.onclick = async () => {
            const r = await post('/api/posts/' + p.id + '/comments', { body: input.value });
            if (r.ok) {
              list.append(commentRow(await r.json()));
              input.value = '';
              err.textContent = '';
              p.comment_count += 1;
              paintComments();
            } else if (r.status === 400) err.textContent = 'Comments must be 1-300 characters';
            else if (r.status === 401) err.textContent = 'Please log in again';
            else err.textContent = 'Something went wrong';
          };
          form.append(input, send);
          cbox.append(form, err);
        };

        card.append(user, img, actions, meta, cbtn, cbox);
        feed.append(card);
      });
    }

    window.addEventListener('hashchange', route);
    renderAuth();
  </script>
</body>
</html>
